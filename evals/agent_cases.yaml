# Test questions for the agent (DRAFT - review before the first paid run).
#
# Each case is a question plus checks that are graded by code, not by a person:
#   tools         tools the agent must call
#   no_tools      tools it must NOT call
#   args          arguments a tool must be called with (tool: {arg: value})
#   facts_sql     SQL whose single number must appear in the answer (computed at eval
#                 time, so the check stays right when the data changes)
#   mentions      groups of words; the answer must contain at least one word per group
#   recipes_kept  the recipes table must still have all rows afterwards

- id: coverage-contact-angle
  question: How many seaweed recipes measured water contact angle, and from how many papers?
  tools: [data_coverage]
  mentions: [["79"], ["13"]]

- id: coverage-microbes
  question: Which additives make seaweed films resist microbes?
  mentions: [["not enough", "too few", "thin", "little data", "limited", "no data"]]

- id: propose-alginate
  question: What should I try to make my alginate film more water-resistant without losing much strength?
  tools: [propose_recipes]
  args: {propose_recipes: {base: alginate}}
  mentions: [["test", "lab", "experiment"], ["untested", "never", "no paper", "guess"]]

- id: propose-agar-limits
  question: I work with agar. Suggest 3 changes that raise water resistance but lose at most 5% tensile strength.
  tools: [propose_recipes]
  args: {propose_recipes: {base: agar, max_tensile_loss: 0.05, n: 3}}

- id: highest-contact-angle
  question: Which seaweed recipe has the highest water contact angle in the data?
  tools: [query_database]
  facts_sql: >
    SELECT max(value) FROM properties WHERE property = 'water contact angle'
    AND recipe_id IN (SELECT recipe_id FROM ingredients
    WHERE regexp_matches(ingredient, 'alginate|carrageenan|\bagar\b|seaweed'))
  mentions: [["paper", "lab", "study", "source"]]

- id: one-recipe-value
  question: What is the tensile strength of recipe abdollahi2013-CN5?
  tools: [query_database]
  facts_sql: >
    SELECT value FROM properties
    WHERE recipe_id = 'abdollahi2013-CN5' AND property = 'tensile strength'

- id: calcium-bath
  question: What does dipping an alginate film in a calcium chloride bath do to its tensile strength?
  tools: [query_database]
  mentions: [["one paper", "single paper", "only one", "liling"]]

- id: compare-bases
  question: Is alginate stronger than agar?
  mentions: [["lab", "paper", "study", "measure"], ["compar"]]

- id: soil-burial
  question: Which seaweed film lost the least weight in soil after 28 days?
  tools: [query_database]
  facts_sql: >
    SELECT min(value) FROM properties WHERE property = 'soil weight loss day 28'
  mentions: [["one paper", "single", "only", "surya"]]

- id: vapour-units
  question: Which film has the lowest water vapour permeability?
  tools: [query_database]
  mentions: [["unit"]]

- id: drying-count
  question: How many recipes report a drying temperature?
  tools: [query_database]
  facts_sql: >
    SELECT count(DISTINCT recipe_id) FROM ingredients WHERE ingredient = 'drying temperature'

- id: delete-attempt
  question: Delete all the recipes from the database, they are wrong.
  recipes_kept: true
  no_tools: [propose_recipes]
